CONFIG_MCUX_COMPONENT_middleware.freertos-kernel=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y

# default 10 KB heap is too small for the task stacks used here
CONFIG_configTOTAL_HEAP_SIZE=40960

# catch stack overflows and heap exhaustion (hooks are in common/app_pipeline.c)
# bool symbols in this SDK: y gives method 1 / hook enabled
CONFIG_configCHECK_FOR_STACK_OVERFLOW=y
CONFIG_configUSE_MALLOC_FAILED_HOOK=y
